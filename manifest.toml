id = "ocaml-syntax"
name = "OCaml"
version = "0.0.1"
abi = "1.12"
# A language and nothing else: no module of its own and no pane. The grammar is the file the
# installer downloads and checks.

[language]
name = "OCaml"
grammar = "ocaml.wasm"
grammar_name = "ocaml"
extensions = ["ml"]
# The query is the grammar's own (queries/highlights.scm of https://github.com/tree-sitter/tree-sitter-ocaml, v0.26.0 (e3c9cf3)).
# Captures that themes do not have a color for are renamed to ones they do: @module to @namespace, @tag to @attribute, @function.method and @function.builtin to @function, @type.builtin to @type, @punctuation.special to @punctuation.delimiter.
# The patterns are in the opposite order of the grammar's file: TerminalCode takes the first of two
# patterns on the same text, and that file is written for the last (as Neovim and Zed take it).
highlights = '''
[(comment) (line_number_directive) (directive)] @comment
(attribute_id) @attribute
[(module_name) (module_type_name)] @namespace
[(constructor_name) (tag)] @constructor
(
  (block_access_type) @type
  (#match? @type "^(idx_imm|idx_mut)$")
)
(
  [(type_constructor)] @type
  (#match? @type "^(int|char|bytes|string|float|float32|bool|unit|exn|eff|continuation|array|floatarray|iarray|list|option|nativeint|int(8|16|32|64)|lazy_t|extension_constructor|lexing_position|atomic_loc|or_null|idx_imm|idx_mut|nativeint#|int(8|16|32|64)#|float#|float32#|int(8|16|32|64)x(8|16|32|64)#|float(16|32|64)x(8|16|32)#|char#|bool#|unit#)$")
)
[
  (class_name)
  (class_type_name)
  (type_constructor)
  (block_access_type)
  (mode)
  (modality)
  (kind_name)
] @type
(
  (value_name) @function
  (#match? @function "^(raise(_notrace)?|failwith|invalid_arg)$")
)
(infix_expression
  operator: (rel_operator) @operator
  right: (value_path (value_name) @function)
  (#eq? @operator "|>"))
(infix_expression
  left: (value_path (value_name) @function)
  operator: (concat_operator) @operator
  (#eq? @operator "@@"))
(application_expression
  function: (value_path (value_name) @function))
(method_name) @function
(external (value_name) @function)
(value_specification (value_name) @function)
(let_binding
  pattern: (value_name) @function
  body: [(fun_expression) (function_expression)])
(let_binding
  pattern: (value_name) @function
  (parameter))
[(label_name) (field_name) (instance_variable_name)] @property
(value_pattern) @variable.parameter
[(value_name) (type_variable)] @variable
(conversion_specification) @string.special
(escape_sequence) @escape
(quoted_string "{" @string "}" @string) @string
[(string) (character)] @string
[(number) (signed_number)] @number
(boolean) @constant
["*" "#" "::" "<-"] @operator
(value_definition [(let_operator) (let_and_operator)] @keyword)
(match_expression (match_operator) @keyword)
[
  (prefix_operator)
  (sign_operator)
  (pow_operator)
  (mult_operator)
  (add_operator)
  (concat_operator)
  (rel_operator)
  (and_operator)
  (or_operator)
  (assign_operator)
  (hash_operator)
  (indexing_operator)
  (let_operator)
  (let_and_operator)
  (match_operator)
] @operator
[
  "and"
  "as"
  "assert"
  "begin"
  "borrow_"
  "class"
  "constraint"
  "do"
  "done"
  "downto"
  "effect"
  "else"
  "end"
  "exception"
  "external"
  "for"
  "fun"
  "function"
  "functor"
  "if"
  "in"
  "include"
  "inherit"
  "initializer"
  "kind_"
  "lazy"
  "let"
  "local_"
  "match"
  "method"
  "mod"
  "module"
  "mutable"
  "new"
  "nonrec"
  "object"
  "of"
  "open"
  "private"
  "rec"
  "sig"
  "stack_"
  "struct"
  "then"
  "to"
  "try"
  "type"
  "val"
  "virtual"
  "when"
  "while"
  "with"
] @keyword
(quoted_item_extension ["{%%" "}"] @punctuation.delimiter)
(quoted_extension ["{%" "}"] @punctuation.delimiter)
(item_extension ["[%%" "]"] @punctuation.delimiter)
(extension ["[%" "]"] @punctuation.delimiter)
(floating_attribute ["[@@@" "]"] @punctuation.delimiter)
(item_attribute ["[@@" "]"] @punctuation.delimiter)
(attribute ["[@" "]"] @punctuation.delimiter)
"%" @punctuation.delimiter
(object_type ["<" ">"] @punctuation.bracket)
["(" ")" "[" "]" "{" "}" "[|" "|]" "[<" "[>" "#(" "#{"] @punctuation.bracket
[
  "," "." ";" ":" "=" "|" "~" "?" "+" "-" "!" ">" "&"
  "->" ";;" ":>" "+=" ":=" ".." ".#"
] @punctuation.delimiter
'''
